<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>담임강사 심방 관리 · 강동교회 내무부</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<style>
:root{
  --ink:#22303e; --deep:#31577a; --deep-dark:#254666; --paper:#f6f4ef; --card:#ffffff;
  --line:#e3ddd2; --accent:#b98a3c; --muted:#7d8896; --danger:#b4483c; --ok:#3e7d55;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
header{background:linear-gradient(160deg,#31577a 0%,#223f5a 100%);color:#fff;padding:26px 0;border-bottom:3px solid var(--accent)}
header .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header .eyebrow{font-size:11px;letter-spacing:.3em;color:#c9b98a;font-weight:600;margin-bottom:6px}
header h1{font-size:21px;font-weight:700}
header .actions{display:flex;gap:8px}
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn-gold{background:var(--accent);color:#fff}
.btn-gold:hover{background:#a3772f}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-.02em}
.stat.health .num{color:var(--danger)}
.stat.wait .num{color:var(--deep)}
.stat.done .num{color:var(--ok)}
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select,.filters input{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
.filters input{flex:1;min-width:160px}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--deep)}
.count-note{font-size:13px;color:var(--muted);margin-left:auto}
.board{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:40px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:#eef1ee;color:#54606e;font-size:12px;font-weight:700;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px;border-bottom:1px solid #efece5;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr.health-row{background:#fdf7f3}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(49,87,122,.04)}
tbody tr.health-row:hover td{background:#faf0ea}
.rank{display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--deep);color:#fff;font-weight:800;font-size:13px;text-align:center;line-height:30px}
tr.health-row .rank{background:var(--danger)}
.name{font-weight:700;font-size:14.5px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-role{background:#eef3f8;color:var(--deep)}
.b-role.top{background:var(--deep);color:#fff}
.b-h1{background:#f2d7d3;color:#8f352b}
.b-h3{background:#eef1ee;color:var(--muted);font-weight:600}
.reason{max-width:260px;font-size:13px;color:#46525f}
td select.status{border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;font-weight:600;background:#fff}
td select.status.s2{border-color:#b8cde0;color:var(--deep)}
td select.status.s3{border-color:#cfa94f;color:#7a5c17}
td select.status.s4{border-color:#9cc4aa;color:var(--ok)}
td input.memo{width:150px;border:1.5px solid transparent;border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;background:#f6f4ef}
td input.memo:focus{outline:none;border-color:var(--deep);background:#fff}
.del{background:none;border:none;color:#c2b8a8;cursor:pointer;font-size:16px;padding:4px}
.del:hover{color:var(--danger)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
@media print{
  header .actions,.filters,thead th:last-child,tbody td:last-child,td select.status,td input.memo{display:none!important}
  td .status-print,td .memo-print{display:block!important;font-size:12px}
  body{background:#fff}
  .board{border:none;box-shadow:none}
  header{background:#fff!important;color:#000;border-bottom:2px solid #000;-webkit-print-color-adjust:exact}
  header .eyebrow{color:#555}
}
.status-print,.memo-print{display:none}
.gate{position:fixed;inset:0;background:var(--paper);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:44px 36px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(40,60,80,.08)}
.gate-card .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--accent);font-weight:700;margin-bottom:10px}
.gate-card h2{font-size:20px;margin-bottom:8px}
.gate-card p{font-size:13.5px;color:var(--muted);margin-bottom:24px}
.gate-card .g-btn{display:inline-flex;align-items:center;gap:10px;background:var(--deep);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.gate-card .g-btn:hover{background:var(--deep-dark)}
.gate-card .gate-err{display:none;margin-top:16px;font-size:13px;color:var(--danger)}
.overlay{display:none;position:fixed;inset:0;background:rgba(30,40,52,.45);z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;box-shadow:0 12px 48px rgba(20,30,45,.25);overflow:hidden}
.modal-head{background:linear-gradient(160deg,#31577a 0%,#223f5a 100%);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:18px;font-weight:700}
.modal-head .close{background:none;border:none;color:#c7d4e0;font-size:22px;cursor:pointer;line-height:1}
.modal-head .close:hover{color:#fff}
.modal-body{padding:22px 24px}
.dl{display:grid;grid-template-columns:96px 1fr;gap:9px 14px;font-size:14px;margin-bottom:18px}
.dl dt{color:var(--muted);font-weight:600;font-size:13px}
.dl dd{color:var(--ink)}
.dl dd.health-txt{color:#8f352b;font-weight:600}
.modal .reason-full{background:#f6f4ef;border-radius:9px;padding:13px 15px;font-size:14px;color:#3c4854;margin-bottom:18px;line-height:1.65}
.modal .sec-label{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.modal-manage{border-top:1px solid var(--line);padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-manage label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.modal-manage select,.modal-manage input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff}
.modal-manage .full{grid-column:1/-1}
.modal-foot{padding:16px 24px 22px;display:flex;gap:8px;justify-content:flex-end}
.btn-deep{background:var(--deep);color:#fff}
.btn-deep:hover{background:var(--deep-dark)}
.btn-line{background:#fff;color:var(--muted);border:1.5px solid var(--line)}
.btn-line:hover{color:var(--ink)}
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .board{overflow-x:auto}
  table{min-width:960px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="eyebrow">GANGDONG CHURCH · 내무부</div>
    <h2>담임강사 심방 관리</h2>
    <p>관리자 전용 페이지입니다.<br>승인된 Google 계정으로 로그인해 주세요.</p>
    <button class="g-btn" onclick="doLogin()">G &nbsp;Google 계정으로 로그인</button>
    <div class="gate-err" id="gateErr">승인되지 않은 계정입니다. 내무부 관리자 계정으로 로그인해 주세요.</div>
  </div>
</div>

<header>
  <div class="wrap">
    <div>
      <div class="eyebrow">GANGDONG CHURCH · 내무부</div>
      <h1>담임강사 심방 신청 관리</h1>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="downloadCSV()">CSV 다운로드</button>
      <button class="btn btn-gold" onclick="window.print()">보고용 인쇄</button>
      <button class="btn btn-ghost" id="btnLogout" style="display:none" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="stats">
    <div class="stat"><div class="label">총 신청</div><div class="num" id="stTotal">0</div></div>
    <div class="stat health"><div class="label">건강 우선 대상</div><div class="num" id="stHealth">0</div></div>
    <div class="stat wait"><div class="label">매칭 대기</div><div class="num" id="stWait">0</div></div>
    <div class="stat done"><div class="label">심방 완료</div><div class="num" id="stDone">0</div></div>
  </div>

  <div class="filters">
    <select id="fDept" onchange="render()">
      <option value="">부서 전체</option>
      <optgroup label="네 생물">
        <option>자문회</option><option>장년회</option><option>부녀회</option><option>청년회</option>
      </optgroup>
      <optgroup label="부서">
        <option>24부서</option><option>신학부</option>
      </optgroup>
    </select>
    <select id="fRole" onchange="render()">
      <option value="">직책 전체</option>
      <option value="중진">중진</option>
      <option value="교역자">교역자 (부서장·회장 포함)</option>
      <option value="임지역장">임지역장 (부서 총무 포함)</option>
      <option value="교관">교관</option>
      <option value="팀장">팀장</option>
      <option value="구역장">구역장</option>
    </select>
    <select id="fHealth" onchange="render()">
      <option value="">건강상태 전체</option>
      <option value="기재">건강 기재 (우선)</option>
      <option value="미기재">미기재</option>
    </select>
    <select id="fStatus" onchange="render()">
      <option value="">상태 전체</option>
      <option>신청접수</option><option>검토중</option><option>매칭완료</option><option>심방완료</option>
    </select>
    <input type="text" id="fSearch" placeholder="이름 검색" oninput="render()">
    <span class="count-note" id="countNote"></span>
  </div>

  <div class="board">
    <table>
      <thead>
        <tr>
          <th>순위</th><th>성명 / 연락처</th><th>소속</th><th>직책</th>
          <th>건강상태</th><th>신청 사유 / 희망시기</th><th>신청일</th>
          <th>상태 / 메모</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">표시할 신청 내역이 없습니다.</div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="mName">신청 상세</h2>
      <button class="close" onclick="closeDetail()">X</button>
    </div>
    <div class="modal-body">
      <dl class="dl">
        <dt>연락처</dt><dd id="mPhone"></dd>
        <dt>소속</dt><dd id="mDept"></dd>
        <dt>직책</dt><dd id="mRole"></dd>
        <dt>건강 상태</dt><dd id="mHealth" class="health-txt"></dd>
        <dt>희망 시기</dt><dd id="mWish"></dd>
        <dt>신청일</dt><dd id="mDate"></dd>
      </dl>
      <div class="sec-label">심방 요청 사유</div>
      <div class="reason-full" id="mReason"></div>
      <div class="modal-manage">
        <div>
          <label>처리 상태</label>
          <select id="mStatus">
            <option>신청접수</option><option>검토중</option><option>매칭완료</option><option>심방완료</option>
          </select>
        </div>
        <div>
          <label>심방 예정일</label>
          <input type="date" id="mScheduled">
        </div>
        <div class="full">
          <label>내무부 메모</label>
          <input type="text" id="mMemo" placeholder="예: 자택 심방 / 오후 선호 등">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-line" onclick="closeDetail()">닫기</button>
      <button class="btn btn-deep" onclick="saveDetail()">저장</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDMMLv3t0evr-q9dD0-4bnzbeg2jlivTNQ",
  authDomain: "gangdong-simbang.firebaseapp.com",
  databaseURL: "https://gangdong-simbang-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gangdong-simbang",
};
const ADMIN_EMAILS = ['huni00321120@gmail.com'];

const ROLE_RANK = { '중진':0, '교역자':1, '임지역장':2, '교관':3, '팀장':4, '구역장':5 };
const STATUS_CLASS = { '신청접수':'', '검토중':'s2', '매칭완료':'s3', '심방완료':'s4' };
const STATUSES = ['신청접수','검토중','매칭완료','심방완료'];

function hasHealth(d){
  const h = (d.health||'').trim();
  return h !== '' && h !== '해당없음';
}

let db = null;
let requests = {};
const $ = id => document.getElementById(id);

function sortEntries(entries){
  return entries.sort((a,b)=>{
    const h = (hasHealth(a[1])?0:1) - (hasHealth(b[1])?0:1);
    if (h !== 0) return h;
    const r = (ROLE_RANK[a[1].role]??9) - (ROLE_RANK[b[1].role]??9);
    if (r !== 0) return r;
    return (a[1].createdAt||0) - (b[1].createdAt||0);
  });
}

function fmtDate(ts){
  if(!ts) return '-';
  const d = new Date(ts);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const fDept=$('fDept').value, fRole=$('fRole').value,
        fHealth=$('fHealth').value, fStatus=$('fStatus').value,
        q=$('fSearch').value.trim();

  const all = sortEntries(Object.entries(requests));

  $('stTotal').textContent  = all.length;
  $('stHealth').textContent = all.filter(function(p){return hasHealth(p[1]);}).length;
  $('stWait').textContent   = all.filter(function(p){return p[1].status==='신청접수'||p[1].status==='검토중';}).length;
  $('stDone').textContent   = all.filter(function(p){return p[1].status==='심방완료';}).length;

  const rows = [];
  all.forEach(function(pair, i){
    const key=pair[0], d=pair[1];
    if (fDept && d.dept!==fDept) return;
    if (fRole && d.role!==fRole) return;
    if (fHealth==='기재' && !hasHealth(d)) return;
    if (fHealth==='미기재' && hasHealth(d)) return;
    if (fStatus && d.status!==fStatus) return;
    if (q && !(d.name||'').includes(q)) return;
    rows.push([key, d, i+1]);
  });

  $('countNote').textContent = rows.length + '건 표시 / 전체 ' + all.length + '건';
  $('emptyMsg').style.display = rows.length ? 'none' : 'block';

  $('tbody').innerHTML = rows.map(function(row){
    const key=row[0], d=row[1], rank=row[2];
    const isHealth = hasHealth(d);
    const roleTop = d.role==='중진'||d.role==='교역자';
    let h = '';
    h += '<tr class="' + (isHealth?'health-row':'') + '" onclick="rowClick(event,\'' + key + '\')">';
    h += '<td><span class="rank">' + rank + '</span></td>';
    h += '<td><div class="name">' + esc(d.name) + '</div><div class="sub">' + esc(d.phone) + '</div></td>';
    h += '<td>' + esc(d.dept) + '<div class="sub">' + esc(d.unit) + '</div></td>';
    h += '<td><span class="badge b-role ' + (roleTop?'top':'') + '">' + esc(d.role) + '</span></td>';
    h += '<td class="reason" style="max-width:180px">';
    if (isHealth) {
      h += '<span class="badge b-h1">건강 우선</span><div class="sub" style="margin-top:5px;color:#8f352b">' + esc(d.health) + '</div>';
    } else {
      h += '<span class="badge b-h3">-</span>';
    }
    h += '</td>';
    h += '<td class="reason">' + esc(d.reason);
    if (d.wishDate) h += '<div class="sub">희망: ' + esc(d.wishDate) + '</div>';
    h += '</td>';
    h += '<td style="white-space:nowrap">' + fmtDate(d.createdAt) + '</td>';
    h += '<td>';
    h += '<select class="status ' + (STATUS_CLASS[d.status]||'') + '" onchange="updateStatus(\'' + key + '\',this.value)">';
    h += STATUSES.map(function(s){return '<option ' + (s===d.status?'selected':'') + '>' + s + '</option>';}).join('');
    h += '</select>';
    h += '<div class="status-print">상태: ' + esc(d.status) + '</div>';
    if (d.scheduledDate) h += '<div class="sub" style="margin-top:5px;font-weight:700;color:var(--deep)">예정: ' + esc(d.scheduledDate) + '</div>';
    h += '<div style="margin-top:6px"><input class="memo" value="' + esc(d.memo) + '" placeholder="내무부 메모" onchange="updateMemo(\'' + key + '\',this.value)"></div>';
    if (d.memo) h += '<div class="memo-print">메모: ' + esc(d.memo) + '</div>';
    h += '</td>';
    h += '<td><button class="del" title="삭제" onclick="removeReq(\'' + key + '\',\'' + esc(d.name) + '\')">x</button></td>';
    h += '</tr>';
    return h;
  }).join('');
}

function updateStatus(key,val){
  requests[key].status = val;
  if (db) db.ref('visitationRequests/'+key+'/status').set(val);
  render();
}
function updateMemo(key,val){
  requests[key].memo = val;
  if (db) db.ref('visitationRequests/'+key+'/memo').set(val);
}
function removeReq(key,name){
  if (!confirm(name + ' 님의 신청을 삭제할까요?')) return;
  delete requests[key];
  if (db) db.ref('visitationRequests/'+key).remove();
  render();
}

let currentKey = null;

function rowClick(e, key){
  if (e.target.closest('select,input,button')) return;
  openDetail(key);
}

function openDetail(key){
  const d = requests[key];
  if (!d) return;
  currentKey = key;
  $('mName').textContent  = d.name + ' 님 신청 상세';
  $('mPhone').textContent = d.phone || '-';
  $('mDept').textContent  = [d.dept, d.unit].filter(Boolean).join(' / ') || '-';
  $('mRole').textContent  = d.role || '-';
  $('mHealth').textContent = hasHealth(d) ? d.health : '기재 없음';
  $('mHealth').className   = hasHealth(d) ? 'health-txt' : '';
  $('mWish').textContent  = d.wishDate || '-';
  $('mDate').textContent  = fmtDate(d.createdAt);
  $('mReason').textContent = d.reason || '-';
  $('mStatus').value      = d.status || '신청접수';
  $('mScheduled').value   = d.scheduledDate || '';
  $('mMemo').value        = d.memo || '';
  $('overlay').classList.add('open');
}

function closeDetail(){
  $('overlay').classList.remove('open');
  currentKey = null;
}

function saveDetail(){
  if (!currentKey || !requests[currentKey]) return;
  const d = requests[currentKey];
  d.status = $('mStatus').value;
  d.scheduledDate = $('mScheduled').value;
  d.memo = $('mMemo').value.trim();
  if (db) db.ref('visitationRequests/'+currentKey).update({
    status: d.status, scheduledDate: d.scheduledDate, memo: d.memo
  });
  closeDetail();
  render();
}

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDetail(); });
document.getElementById('overlay').addEventListener('click', function(e){ if (e.target === this) closeDetail(); });

function downloadCSV(){
  const all = sortEntries(Object.entries(requests));
  const head = ['우선순위','성명','연락처','부서','세부소속','직책','건강상태','신청사유','희망시기','신청일','상태','심방예정일','메모'];
  const lines = [head.join(',')];
  all.forEach(function(pair,i){
    const d=pair[1];
    const row = [i+1,d.name,d.phone,d.dept,d.unit,d.role,hasHealth(d)?d.health:'',d.reason,d.wishDate,fmtDate(d.createdAt),d.status,d.scheduledDate||'',d.memo]
      .map(function(v){return '"' + String(v==null?'':v).replace(/"/g,'""') + '"';});
    lines.push(row.join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '심방신청_우선순위_' + fmtDate(Date.now()) + '.csv';
  a.click();
}

let auth = null;
let dataAttached = false;

function doLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function(err){
    console.error(err);
    $('gateErr').textContent = '로그인 중 오류가 발생했습니다: ' + (err.code||'');
    $('gateErr').style.display = 'block';
  });
}
function doLogout(){
  if (auth) auth.signOut();
}

firebase.initializeApp(firebaseConfig);
db = firebase.database();
auth = firebase.auth();

auth.onAuthStateChanged(function(user){
  const email = user ? (user.email||'').toLowerCase() : '';
  if (user && ADMIN_EMAILS.includes(email)) {
    $('gate').style.display = 'none';
    $('btnLogout').style.display = 'inline-block';
    if (!dataAttached) {
      dataAttached = true;
      db.ref('visitationRequests').on('value', function(snap){
        requests = snap.val() || {};
        render();
      });
    }
  } else if (user) {
    $('gateErr').style.display = 'block';
    auth.signOut();
  } else {
    $('gate').style.display = 'flex';
    $('btnLogout').style.display = 'none';
    if (dataAttached) { db.ref('visitationRequests').off(); dataAttached = false; }
    requests = {};
    render();
  }
});
</script>
</body>
